acity:1 } 100% { opacity:0 } }@keyframes k40 { 0%,42.66% { opacity:0 } 43.01% { opacity:1 } 96% { opacity:1 } 100% { opacity:0 } }@keyframes k41 { 0%,43.74% { opacity:0 } 44.09% { opacity:1 } 96% { opacity:1 } 100% { opacity:0 } }@keyframes k42 { 0%,44.81% { opacity:0 } 45.16% { opacity:1 } 96% { opacity:1 } 100% { opacity:0 } }@keyframes k43 { 0%,45.89% { opacity:0 } 46.24% { opacity:1 } 96% { opacity:1 } 100% { opacity:0 } }@keyframes k44 { 0%,46.96% { opacity:0 } 47.31% { opacity:1 } 96% { opacity:1 } 100% { opacity:0 } }@keyframes k45 { 0%,48.04% { opacity:0 } 48.39% { opacity:1 } 96% { opacity:1 } 100% { opacity:0 } }@keyframes k46 { 0%,49.11% { opacity:0 } 49.46% { opacity:1 } 96% { opacity:1 } 100% { opacity:0 } }@keyframes k47 { 0%,50.19% { opacity:0 } 50.54% { opacity:1 } 96% { opacity:1 } 100% { opacity:0 } }@keyframes k48 { 0%,51.26% { opacity:0 } 51.61% { opacity:1 } 96% { opacity:1 } 100% { opacity:0 } }@keyframes k49 { 0%,52.34% { opacity:0 } 52.69% { opacity:1 } 96% { opacity:1 } 100% { opacity:0 } }@keyframes k50 { 0%,53.41% { opacity:0 } 53.76% { opacity:1 } 96% { opacity:1 } 100% { opacity:0 } }@keyframes k51 { 0%,54.49% { opacity:0 } 54.84% { opacity:1 } 96% { opacity:1 } 100% { opacity:0 } }@keyframes k52 { 0%,55.56% { opacity:0 } 55.91% { opacity:1 } 96% { opacity:1 } 100% { opacity:0 } }
