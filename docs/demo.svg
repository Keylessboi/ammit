acity:1 } 100% { opacity:0 } }@keyframes k40 { 0%,41.90% { opacity:0 } 42.25% { opacity:1 } 96% { opacity:1 } 100% { opacity:0 } }@keyframes k41 { 0%,42.96% { opacity:0 } 43.31% { opacity:1 } 96% { opacity:1 } 100% { opacity:0 } }@keyframes k42 { 0%,44.02% { opacity:0 } 44.37% { opacity:1 } 96% { opacity:1 } 100% { opacity:0 } }@keyframes k43 { 0%,45.07% { opacity:0 } 45.42% { opacity:1 } 96% { opacity:1 } 100% { opacity:0 } }@keyframes k44 { 0%,46.13% { opacity:0 } 46.48% { opacity:1 } 96% { opacity:1 } 100% { opacity:0 } }@keyframes k45 { 0%,47.19% { opacity:0 } 47.54% { opacity:1 } 96% { opacity:1 } 100% { opacity:0 } }@keyframes k46 { 0%,48.24% { opacity:0 } 48.59% { opacity:1 } 96% { opacity:1 } 100% { opacity:0 } }@keyframes k47 { 0%,49.30% { opacity:0 } 49.65% { opacity:1 } 96% { opacity:1 } 100% { opacity:0 } }@keyframes k48 { 0%,50.35% { opacity:0 } 50.70% { opacity:1 } 96% { opacity:1 } 100% { opacity:0 } }@keyframes k49 { 0%,51.41% { opacity:0 } 51.76% { opacity:1 } 96% { opacity:1 } 100% { opacity:0 } }@keyframes k50 { 0%,52.47% { opacity:0 } 52.82% { opacity:1 } 96% { opacity:1 } 100% { opacity:0 } }@keyframes k51 { 0%,53.52% { opacity:0 } 53.87% { opacity:1 } 96% { opacity:1 } 100% { opacity:0 } }@keyframes k52 { 0%,54.58% { opacity:0 } 54.93% { opacity:1 } 96% { opacity:1 } 100% { opacity:0 } }
.l { opacity: 0; }
